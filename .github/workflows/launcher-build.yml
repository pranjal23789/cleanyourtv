name: Build launcher
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Apply config
        working-directory: launcher/app/src/main/res/values
        run: |
          sed -i 's/com\.mediatek\.wwtv\.tvcenter/com.android.tv/g' config.xml
          sed -i 's|<integer name="columns">4</integer>|<integer name="columns">6</integer>|' config.xml
          python3 - <<'PY'
          import re
          s = open('config.xml', encoding='utf-8').read()
          s = re.sub(r'(<string-array name="dock_apps">).*?(</string-array>)', r'\1\n    \2', s, flags=re.S)
          open('config.xml', 'w', encoding='utf-8').write(s)
          PY
          grep -nE 'name="columns"|live_tv_package|name="dock_apps"' -A1 config.xml
      - name: Build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: launcher/app/build/outputs/apk/debug/*.apk
